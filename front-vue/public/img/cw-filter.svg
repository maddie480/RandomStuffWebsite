<!-- Inspired by https://stackoverflow.com/a/30949302 -->
<svg
        width="230"
        height="120"
        xmlns="http://www.w3.org/2000/svg"
>
    <filter id="blurMe">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>

    <filter id="f1" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feColorMatrix id="tinter" type="matrix" values=".4 .0 .0 .0 .0
                                                         .7 .0 .0 .0 .0
                                                         .9 .0 .0 .0 .0
                                                         .0 .0 .0  1 .0"/>
    </filter>
    <filter id="f2" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feColorMatrix id="tinter" type="matrix" values=".8 .0 .0 .0 .0
                                                         .7 .0 .0 .0 .0
                                                         .3 .0 .0 .0 .0
                                                         .0 .0 .0  1 .0"/>
    </filter>
    <filter id="f3" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feColorMatrix id="tinter" type="matrix" values=".8 .0 .0 .0 .0
                                                         .5 .0 .0 .0 .0
                                                         .5 .0 .0 .0 .0
                                                         .0 .0 .0  1 .0"/>
    </filter>

    <circle cx="60" cy="60" r="50" fill="white" filter="url(#f1)"/>

    <circle cx="170" cy="60" r="50" fill="green" filter="url(#blurMe)"/>
</svg>
